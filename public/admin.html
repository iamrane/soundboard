<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soundboard 01 — Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="deck">
    <header class="faceplate">
      <div class="brand">
        <div class="brand-name">Soundboard<span class="unit">·01</span></div>
        <div class="brand-sub">Service panel</div>
      </div>
      <div class="lcd" aria-live="polite">
        <span class="lcd-status" id="lcd-status">ADMIN MODE</span>
      </div>
      <div class="controls">
        <a class="hw-btn" href="/">Board</a>
      </div>
    </header>

    <section class="panel-card">
      <h2 class="panel-title" id="form-title">Add clip</h2>
      <form class="clip-form" id="clip-form">
        <div class="field">
          <label for="f-name">Pad name</label>
          <input id="f-name" name="name" maxlength="40" required placeholder="Airhorn" autocomplete="off" />
        </div>
        <div class="field">
          <label for="f-url">YouTube URL</label>
          <input id="f-url" name="url" required placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
        </div>
        <div class="time-row">
          <div class="field">
            <label for="f-start">Start time</label>
            <input id="f-start" name="start" required placeholder="0:07 or 7" autocomplete="off" />
            <span class="hint">Seconds or m:ss — decimals allowed</span>
          </div>
          <div class="field">
            <label for="f-end">End time</label>
            <input id="f-end" name="end" required placeholder="0:12 or 12" autocomplete="off" />
            <span class="hint">Must be after the start time</span>
          </div>
        </div>
        <div class="field">
          <label id="color-label">Pad color</label>
          <div class="color-picker" id="color-picker" role="radiogroup" aria-labelledby="color-label"></div>
        </div>
        <div class="form-actions full">
          <button class="hw-btn" type="submit" id="submit-btn">Add to board</button>
          <button class="hw-btn" type="button" id="preview-btn">► Test timing</button>
          <button class="ghost-btn" type="button" id="cancel-edit" hidden>Cancel edit</button>
          <span class="form-msg" id="form-msg" role="status"></span>
        </div>
      </form>
    </section>

    <section class="panel-card">
      <h2 class="panel-title">Clips on the board</h2>
      <div class="clip-list" id="clip-list"></div>
    </section>
  </main>

  <div class="yt-holder" id="yt-holder" aria-hidden="true"></div>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
