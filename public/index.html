<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soundboard 01</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="deck">
    <header class="faceplate">
      <div class="brand">
        <div class="brand-name">Soundboard<span class="unit">·01</span></div>
        <div class="brand-sub">Shared board</div>
      </div>
      <div class="lcd" aria-live="polite">
        <span class="lcd-status" id="lcd-status">BOOTING…</span>
        <span class="lcd-meter" id="lcd-meter"></span>
        <span class="lcd-time" id="lcd-time"></span>
      </div>
      <div class="controls">
        <button class="hw-btn stop" id="stop-btn" type="button">Stop</button>
        <a class="hw-btn" href="/admin">Admin</a>
      </div>
    </header>

    <section class="pad-grid" id="pad-grid" aria-label="Sound pads"></section>
  </main>

  <div class="yt-holder" id="yt-holder" aria-hidden="true"></div>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
